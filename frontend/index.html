<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente de Planilhas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #202124; }
    h1 { font-size: 1.6rem; }
    #chat { min-height: 280px; border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin: 20px 0; }
    .msg { padding: 10px 12px; margin: 8px 0; border-radius: 8px; white-space: pre-wrap; }
    .user { background: #e8f0fe; }
    .assistant { background: #f1f3f4; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <h1>Assistente de Planilhas</h1>
  <p>Converse para consultar sua planilha Google. Alterações ainda precisam de confirmação e serão habilitadas em uma próxima etapa.</p>
  <div id="chat" aria-live="polite"></div>
  <form id="form">
    <input id="message" placeholder="Ex.: leia o intervalo A1:C10 da aba Vendas" autocomplete="off" required>
    <button id="send" type="submit">Enviar</button>
  </form>
  <script>
    const form = document.querySelector("#form");
    const input = document.querySelector("#message");
    const chat = document.querySelector("#chat");
    const send = document.querySelector("#send");

    function addMessage(text, role) {
      const item = document.createElement("div");
      item.className = "msg " + role;
      item.textContent = text;
      chat.appendChild(item);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        addMessage(data.reply || data.error || "Ocorreu um erro.", "assistant");
      } catch {
        addMessage("Não foi possível conectar ao servidor.", "assistant");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
