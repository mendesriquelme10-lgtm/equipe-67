name: Universo IF Avalia CI
on:
  push:
    branches: [feat/universo-if-avalia-mvp]
    paths: ['universo-if-avalia/**', '.github/workflows/universo-if-avalia-ci.yml']
  pull_request:
    paths: ['universo-if-avalia/**', '.github/workflows/universo-if-avalia-ci.yml']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universo-if-avalia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build